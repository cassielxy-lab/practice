const poems=[["前出塞九首·其六","唐·杜甫","挽弓当挽强，用箭当用长。\n射人先射马，擒贼先擒王。\n杀人亦有限，列国自有疆。\n苟能制侵陵，岂在多杀伤。"],["秋夕","唐·杜牧","银烛秋光冷画屏，轻罗小扇扑流萤。\n天阶夜色凉如水，坐看牵牛织女星。"],["竹枝词二首·其一","唐·刘禹锡","杨柳青青江水平，闻郎江上踏歌声。\n东边日出西边雨，道是无晴却有晴。"],["卜算子·送鲍浩然之浙东","宋·王观","水是眼波横，山是眉峰聚。\n欲问行人去那边？眉眼盈盈处。\n才始送春归，又送君归去。\n若到江南赶上春，千万和春住。"],["绝句·古木阴中系短篷","宋·志南","古木阴中系短篷，杖藜扶我过桥东。\n沾衣欲湿杏花雨，吹面不寒杨柳风。"],["南园十三首·其五","唐·李贺","男儿何不带吴钩，收取关山五十州。\n请君暂上凌烟阁，若个书生万户侯？"],["月夜忆舍弟","唐·杜甫","戍鼓断人行，边秋一雁声。\n露从今夜白，月是故乡明。\n有弟皆分散，无家问死生。\n寄书长不达，况乃未休兵。"],["春日五首·其二","宋·秦观","一夕轻雷落万丝，霁光浮瓦碧参差。\n有情芍药含春泪，无力蔷薇卧晓枝。"],["丑奴儿·书博山道中壁","宋·辛弃疾","少年不识愁滋味，爱上层楼。\n爱上层楼，为赋新词强说愁。\n而今识尽愁滋味，欲说还休。\n欲说还休，却道 “天凉好个秋”！"],["生查子·元夕","宋·欧阳修","去年元夜时，花市灯如昼。\n月上柳梢头，人约黄昏后。\n今年元夜时，月与灯依旧。\n不见去年人，泪湿春衫袖。"],["自嘲","近现代·鲁迅","运交华盖欲何求，未敢翻身已碰头。\n破帽遮颜过闹市，漏船载酒泛中流。\n横眉冷对千夫指，俯首甘为孺子牛。\n躲进小楼成一统，管他冬夏与春秋。"],["杂诗十二首·其一","东晋·陶渊明","人生无根蒂，飘如陌上尘。\n分散逐风转，此已非常身。\n落地为兄弟，何必骨肉亲！\n得欢当作乐，斗酒聚比邻。\n盛年不重来，一日难再晨。\n及时当勉励，岁月不待人。"],["长歌行","汉·佚名","青青园中葵，朝露待日晞。\n阳春布德泽，万物生光辉。\n常恐秋节至，焜黄华叶衰。\n百川东到海，何时复西归？\n少壮不努力，老大徒伤悲！"],["摊破浣溪沙·手卷真珠上玉钩","五代·李璟","手卷真珠上玉钩，依前春恨锁重楼。\n风里落花谁是主？思悠悠。\n青鸟不传云外信，丁香空结雨中愁。\n回首绿波三楚暮，接天流。"],["虞美人·春花秋月何时了","五代·李煜","春花秋月何时了？往事知多少。\n小楼昨夜又东风，故国不堪回首月明中。\n雕栏玉砌应犹在，只是朱颜改。\n问君能有几多愁？恰似一江春水向东流。"],["蝶恋花·槛菊愁烟兰泣露","宋·晏殊","槛菊愁烟兰泣露，罗幕轻寒，燕子双飞去。\n明月不谙离恨苦，斜光到晓穿朱户。\n昨夜西风凋碧树，独上高楼，望尽天涯路。\n欲寄彩笺兼尺素，山长水阔知何处？"],["浣溪沙·游蕲水清泉寺","宋·苏轼","游蕲水清泉寺，寺临兰溪，溪水西流。\n山下兰芽短浸溪，松间沙路净无泥。\n萧萧暮雨子规啼。\n谁道人生无再少？门前流水尚能西！\n休将白发唱黄鸡。"],["清平乐·春归何处","宋·黄庭坚","春归何处？寂寞无行路。\n若有人知春去处，唤取归来同住。\n春无踪迹谁知？除非问取黄鹂。\n百啭无人能解，因风飞过蔷薇。"],["春江花月夜","唐·张若虚","春江潮水连海平，海上明月共潮生。\n滟滟随波千万里，何处春江无月明！\n江流宛转绕芳甸，月照花林皆似霰。\n空里流霜不觉飞，汀上白沙看不见。\n江天一色无纤尘，皎皎空中孤月轮。\n江畔何人初见月？江月何年初照人？\n人生代代无穷已，江月年年望相似。\n不知江月待何人，但见长江送流水。\n白云一片去悠悠，青枫浦上不胜愁。\n谁家今夜扁舟子？何处相思明月楼？\n可怜楼上月徘徊，应照离人妆镜台。\n玉户帘中卷不去，捣衣砧上拂还来。\n此时相望不相闻，愿逐月华流照君。\n鸿雁长飞光不度，鱼龙潜跃水成文。\n昨夜闲潭梦落花，可怜春半不还家。\n江水流春去欲尽，江潭落月复西斜。\n斜月沉沉藏海雾，碣石潇湘无限路。\n不知乘月几人归，落月摇情满江树。"],["观刈麦","唐·白居易","田家少闲月，五月人倍忙。\n夜来南风起，小麦覆陇黄。\n妇姑荷箪食，童稚携壶浆。\n相随饷田去，丁壮在南冈。\n足蒸暑土气，背灼炎天光。\n力尽不知热，但惜夏日长。\n复有贫妇人，抱子在其旁。\n右手秉遗穗，左臂悬敝筐。\n听其相顾言，闻者为悲伤。\n家田输税尽，拾此充饥肠。\n今我何功德？曾不事农桑。\n吏禄三百石，岁晏有余粮。\n念此私自愧，尽日不能忘。"],["村行","宋·王禹偁","马穿山径菊初黄，信马悠悠野兴长。\n万壑有声含晚籁，数峰无语立斜阳。\n棠梨叶落胭脂色，荞麦花开白雪香。\n何事吟余忽惆怅，村桥原树似吾乡。"],["七夕","唐·李商隐","鸾扇斜分凤幄开，星桥横过鹊飞回。\n争将世上无期别，换得年年一度来。"],["病起书怀","宋·陆游","病骨支离纱帽宽，孤臣万里客江干。\n位卑未敢忘忧国，事定犹须待阖棺。\n天地神灵扶庙社，京华父老望和銮。\n出师一表通今古，夜半挑灯更细看。"],["月夜听卢子顺弹琴","唐·李白","闲坐夜明月，幽人弹素琴。\n忽闻悲风调，宛若寒松吟。\n白雪乱纤手，绿水清虚心。\n钟期久已没，世上无知音。"],["入若耶溪","南朝梁·王籍","艅艎何泛泛，空水共悠悠。\n阴霞生远岫，阳景逐回流。\n蝉噪林逾静，鸟鸣山更幽。\n此地动归念，长年悲倦游。"],["秋夜将晓出篱门迎凉有感二首·其一","宋·陆游","迢迢天汉西南落，喔喔邻鸡一再鸣。\n壮志病来消欲尽，出门搔首怆平生。"],["寄张元夫","唐·薛涛","前溪独立后溪行，鹭识朱衣自不惊。\n借问人间愁寂意，伯牙弦绝已无声。"],["写意二首·其一","唐·牟融","寂寥荒馆闭闲门，苔径阴阴屐少痕。\n白发颠狂尘梦断，青毡泠落客心存。\n高山流水琴三弄，明月清风酒一樽。\n醉后曲肱林下卧，此生荣辱不须论。"],["登池上楼","南朝宋·谢灵运","潜虬媚幽姿，飞鸿响远音。\n薄霄愧云浮，栖川怍渊沉。\n进德智所拙，退耕力不任。\n徇禄反穷海，卧疴对空林。\n衾枕昧节候，褰开暂窥临。\n倾耳聆波澜，举目眺岖嵚。\n初景革绪风，新阳改故阴。\n池塘生春草，园柳变鸣禽。\n祁祁伤豳歌，萋萋感楚吟。\n索居易永久，离群难处心。\n持操岂独古，无闷征在今。"],["代赠二首·其一","唐·李商隐","楼上黄昏欲望休，玉梯横绝月如钩。\n芭蕉不展丁香结，同向春风各自愁。"],["曲池荷","唐·卢照邻","浮香绕曲岸，圆影覆华池。\n常恐秋风早，飘零君不知。"],["忆秦娥·娄山关","近现代·毛泽东","西风烈， 长空雁叫霜晨月。\n霜晨月， 马蹄声碎，喇叭声咽。\n雄关漫道真如铁， 而今迈步从头越。\n从头越， 苍山如海，残阳如血。"],["晚登三山还望京邑","南朝齐·谢朓","灞涘望长安，河阳视京县。\n白日丽飞甍，参差皆可见。\n余霞散成绮，澄江静如练。\n喧鸟覆春洲，杂英满芳甸。\n去矣方滞淫，怀哉罢欢宴。\n佳期怅何许，泪下如流霰。\n有情知望乡，谁能鬒不变？"],["忆江上吴处士","唐·贾岛","闽国扬帆去，蟾蜍亏复圆。\n秋风生渭水，落叶满长安。\n此地聚会夕，当时雷雨寒。\n兰桡殊未返，消息海云端。"],["洞仙歌·丁卯八月病中作","宋·辛弃疾","贤愚相去，算其间能几。\n差以毫厘缪千里。\n细思量义利，舜跖之分， 孳孳者，等是鸡鸣而起。\n味甘终易坏，岁晚还知， 君子之交淡如水。\n一饷聚飞蚊，其响如雷， 深自觉、昨非今是。\n羡安乐窝中泰和汤， 更剧饮，无过半醺而已。"],["菩萨蛮·大柏地","近现代·毛泽东","赤橙黄绿青蓝紫， 谁持彩练当空舞？\n雨后复斜阳， 关山阵阵苍。\n当年鏖战急， 弹洞前村壁。\n装点此关山， 今朝更好看。"],["十六字令三首·其一","近现代·毛泽东","山， 快马加鞭未下鞍。\n惊回首， 离天三尺三。"],["十六字令三首·其二","近现代·毛泽东","山， 倒海翻江卷巨澜。\n奔腾急， 万马战犹酣。"],["十六字令三首·其三","近现代·毛泽东","山， 刺破青天锷未残。\n天欲堕， 赖以拄其间。"],["清平乐·六盘山","近现代·毛泽东","天高云淡， 望断南飞雁。\n不到长城非好汉， 屈指行程二万。\n六盘山上高峰， 红旗漫卷西风。\n今日长缨在手， 何时缚住苍龙？"],["白马篇","三国魏·曹植","白马饰金羁，连翩西北驰。\n借问谁家子？幽并游侠儿。\n少小去乡邑，扬声沙漠垂。\n宿昔秉良弓，楛矢何参差。\n控弦破左的，右发摧月支。\n仰手接飞猱，俯身散马蹄。\n狡捷过猴猿，勇剽若豹螭。\n边城多警急，虏骑数迁移。\n羽檄从北来，厉马登高堤。\n长驱蹈匈奴，左顾凌鲜卑。\n弃身锋刃端，性命安可怀？\n父母且不顾，何言子与妻！\n名编壮士籍，不得中顾私。\n捐躯赴国难，视死忽如归！"],["答客诮","近现代·鲁迅","无情未必真豪杰，怜子如何不丈夫。\n知否兴风狂啸者，回眸时看小於菟。"],["满江红·和郭沫若同志","近现代·毛泽东","小小寰球，有几个苍蝇碰壁。\n嗡嗡叫，几声凄厉，几声抽泣。\n蚂蚁缘槐夸大国，蚍蜉撼树谈何易。\n正西风落叶下长安，飞鸣镝。\n多少事，从来急；\n天地转，光阴迫。\n一万年太久，只争朝夕。\n四海翻腾云水怒，五洲震荡风雷激。\n要扫除一切害人虫，全无敌。"],["送安惇秀才失解西归","宋·苏轼","旧书不厌百回读，熟读深思子自知。\n他年名宦恐不免，今日栖迟那可追。\n我昔家居断还往，著书不复窥园葵。\n朅来东游慕人爵，弃去旧学从儿嬉。\n狂谋谬算百不遂，惟有霜鬓来如期。\n故山松柏皆手种，行且拱矣归何时。\n万事早知皆有命，十年浪走宁非痴。\n与君未可较得失，临别惟有长嗟咨。"],["赴戍登程口占示家人二首·其二","清·林则徐","力微任重久神疲，再竭衰庸定不支。\n苟利国家生死以，岂因祸福避趋之。\n谪居正是君恩厚，养拙刚于戍卒宜。\n戏与山妻谈故事，试吟断送老头皮。"],["追感往事五首·其一","宋·陆游","太平翁翁十九年，父子气焰可熏天。\n不如茅舍醉村酒，日与邻翁相枕眠。"],["追感往事五首·其二","宋·陆游","世事纷纷过眼新， 九衢依旧涨红尘。\n桃花梦破刘郎老， 燕麦摇风别是春。"],["追感往事五首·其三","宋·陆游","渡江之初不暇给，诸老文辞今尚传。\n六十年间日衰靡，此事安可付之天。"],["追感往事五首·其四","宋·陆游","文章光焰伏不起，甚者自谓宗晚唐。\n欧曾不生二苏死，我欲痛哭天茫茫。"],["追感往事五首·其五","宋·陆游","诸公可叹善谋身，误国当时岂一秦。\n不望夷吾出江左，新亭对泣亦无人！"],["屏迹三首·其二","唐·杜甫","晚起家何事，无营地转幽。\n竹光团野色，舍影漾江流。\n失学从儿懒，长贫任妇愁。\n百年浑得醉，一月不梳头。"],["和董传留别","宋·苏轼","粗缯大布裹生涯，腹有诗书气自华。\n厌伴老儒烹瓠叶，强随举子踏槐花。\n囊空不办寻春马，眼乱行看择婿车。\n得意犹堪夸世俗，诏黄新湿字如鸦。"],["前出塞九首·其一","唐·杜甫","戚戚去故里，悠悠赴交河。\n公家有程期，亡命婴祸罗。\n君已富土境，开边一何多。\n弃绝父母恩，吞声行负戈。"],["前出塞九首·其二","唐·杜甫","出门日已远，不受徒旅欺。\n骨肉恩岂断，男儿死无时。\n走马脱辔头，手中挑青丝。\n捷下万仞冈，俯身试搴旗。"],["前出塞九首·其三","唐·杜甫","磨刀呜咽水，水赤刃伤手。\n欲轻肠断声，心绪乱已久。\n丈夫誓许国，愤惋复何有！\n功名图麒麟，战骨当速朽。"],["前出塞九首·其四","唐·杜甫","送徒既有长，远戍亦有身。\n生死向前去，不劳吏怒嗔。\n路逢相识人，附书与六亲。\n哀哉两决绝，不复同苦辛。"],["前出塞九首·其五","唐·杜甫","迢迢万里余，领我赴三军。\n军中异苦乐，主将宁尽闻。\n隔河见胡骑，倏忽数百群。\n我始为奴仆，几时树功勋。"],["前出塞九首·其七","唐·杜甫","驱马天雨雪，军行入高山。\n径危抱寒石，指落层冰间。\n已去汉月远，何时筑城还。\n浮云暮南征，可望不可攀。"],["前出塞九首·其八","唐·杜甫","单于寇我垒，百里风尘昏。\n雄剑四五动，彼军为我奔。\n虏其名王归，系颈授辕门。\n潜身备行列，一胜何足论。"],["前出塞九首·其九","唐·杜甫","从军十年余，能无分寸功。\n众人贵苟得，欲语羞雷同。\n中原有斗争，况在狄与戎。\n丈夫四方志，安可辞固穷。"],["竹里馆","唐·王维","独坐幽篁里，弹琴复长啸。\n深林人不知，明月来相照。"],["江南逢李龟年","唐·杜甫","岐王宅里寻常见，崔九堂前几度闻。\n正是江南好风景，落花时节又逢君。"],["逢入京使","唐·岑参","故园东望路漫漫，双袖龙钟泪不干。\n马上相逢无纸笔，凭君传语报平安。"],["峨眉山月歌","唐·李白","峨眉山月半轮秋，影入平羌江水流。\n夜发清溪向三峡，思君不见下渝州。"],["晚春","唐·韩愈","草树知春不久归，百般红紫斗芳菲。\n杨花榆荚无才思，惟解漫天作雪飞。"],["游山西村","宋·陆游","莫笑农家腊酒浑，丰年留客足鸡豚。\n山重水复疑无路，柳暗花明又一村。\n箫鼓追随春社近，衣冠简朴古风存。\n从今若许闲乘月，拄杖无时夜叩门。"],["观沧海","东汉·曹操","东临碣石，以观沧海。\n水何澹澹，山岛竦峙。\n树木丛生，百草丰茂。\n秋风萧瑟，洪波涌起。\n日月之行，若出其中；\n星汉灿烂，若出其里。\n幸甚至哉，歌以咏志。"],["望岳","唐·杜甫","岱宗夫如何？齐鲁青未了。\n造化钟神秀，阴阳割昏晓。\n荡胸生曾云，决眦入归鸟。\n会当凌绝顶，一览众山小。"],["登幽州台歌","唐·陈子昂","前不见古人，后不见来者。\n念天地之悠悠，独怆然而涕下！"],["登飞来峰","宋·王安石","飞来山上千寻塔，闻说鸡鸣见日升。\n不畏浮云遮望眼，自缘身在最高层。"],["春夜洛城闻笛","唐·李白","谁家玉笛暗飞声，散入春风满洛城。\n此夜曲中闻折柳，何人不起故园情。"],["诉衷情·当年万里觅封侯","宋·陆游","当年万里觅封侯，匹马戍梁州。\n关河梦断何处？尘暗旧貂裘。\n胡未灭，鬓先秋，泪空流。\n此生谁料，心在天山，身老沧洲。"],["十一月四日风雨大作二首·其二","宋·陆游","僵卧孤村不自哀，尚思为国戍轮台。\n夜阑卧听风吹雨，铁马冰河入梦来。"],["贾生","唐·李商隐","宣室求贤访逐臣，贾生才调更无伦。\n可怜夜半虚前席，不问苍生问鬼神。"],["过松源晨炊漆公店六首·其五","宋·杨万里","莫言下岭便无难，赚得行人错喜欢。\n正入万山圈子里，一山放出一山拦。"],["天净沙·秋思","元·马致远","枯藤老树昏鸦， 小桥流水人家，\n古道西风瘦马。\n夕阳西下，断肠人在天涯。"],["秋词二首·其一","唐·刘禹锡","自古逢秋悲寂寥，我言秋日胜春朝。\n晴空一鹤排云上，便引诗情到碧霄。"],["次北固山下","唐·王湾","客路青山外，行舟绿水前。\n潮平两岸阔，风正一帆悬。\n海日生残夜，江春入旧年。\n乡书何处达？归雁洛阳边。"],["夜雨寄北","唐·李商隐","君问归期未有期，巴山夜雨涨秋池。\n何当共剪西窗烛，却话巴山夜雨时。"],["泊秦淮","唐·杜牧","烟笼寒水月笼沙，夜泊秦淮近酒家。\n商女不知亡国恨，隔江犹唱后庭花。"],["夜上受降城闻笛","唐·李益","回乐烽前沙似雪，受降城外月如霜。\n不知何处吹芦管，一夜征人尽望乡。"],["鹧鸪天·有客慨然谈功名因追念少年时事戏作","宋·辛弃疾","壮岁旌旗拥万夫，锦襜突骑渡江初。\n燕兵夜娖银胡觮，汉箭朝飞金仆姑。\n追往事，叹今吾，春风不染白髭须。\n却将万字平戎策，换得东家种树书。"],["约客","宋·赵师秀","黄梅时节家家雨，青草池塘处处蛙。\n有约不来过夜半，闲敲棋子落灯花。"],["行军九日思长安故园","唐·岑参","强欲登高去，无人送酒来。\n遥怜故园菊，应傍战场开。"],["金错刀行","宋·陆游","黄金错刀白玉装，夜穿窗扉出光芒。\n丈夫五十功未立，提刀独立顾八荒。\n京华结交尽奇士，意气相期共生死。\n千年史册耻无名，一片丹心报天子。\n尔来从军天汉滨，南山晓雪玉嶙峋。\n呜呼！楚虽三户能亡秦，岂有堂堂中国空无人！"],["闻王昌龄左迁龙标遥有此寄","唐·李白","杨花落尽子规啼，闻道龙标过五溪。\n我寄愁心与明月，随君直到夜郎西。"],["秦州杂诗二十首·其七","唐·杜甫","莽莽万重山，孤城山谷间。\n无风云出塞，不夜月临关。\n属国归何晚，楼兰斩未还。\n烟尘独长望，衰飒正摧颜。"],["金陵驿二首·其一","宋·文天祥","草合离宫转夕晖，孤云飘泊复何依？\n山河风景元无异，城郭人民半已非。\n满地芦花和我老，旧家燕子傍谁飞？\n从今别却江南路，化作啼鹃带血归。"],["己亥杂诗·浩荡离愁白日斜","清·龚自珍","浩荡离愁白日斜，吟鞭东指即天涯。\n落红不是无情物，化作春泥更护花。"],["闻武均州报已复西京","宋·陆游","白发将军亦壮哉，西京昨夜捷书来。\n胡儿敢作千年计，天意宁知一日回。\n列圣仁恩深雨露，中兴赦令疾风雷。\n悬知寒食朝陵使，驿路梨花处处开。"],["潼关","清·谭嗣同","终古高云簇此城，秋风吹散马蹄声。\n河流大野犹嫌束，山入潼关不解平。"],["木兰诗·第一段","北朝民歌·佚名","唧唧复唧唧，木兰当户织。\n不闻机杼声，唯闻女叹息。\n问女何所思，问女何所忆。\n女亦无所思，女亦无所忆。\n昨夜见军帖，可汗大点兵。\n军书十二卷，卷卷有爷名。\n阿爷无大儿，木兰无长兄。\n愿为市鞍马，从此替爷征。"],["木兰诗·第二段","北朝民歌·佚名","东市买骏马，西市买鞍鞯， 南市买辔头，北市买长鞭。\n旦辞爷娘去，暮宿黄河边。\n不闻爷娘唤女声，但闻黄河流水鸣溅溅。\n旦辞黄河去，暮至黑山头。\n不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。"],["木兰诗·第三段","北朝民歌·佚名","万里赴戎机，关山度若飞。\n朔气传金柝，寒光照铁衣。\n将军百战死，壮士十年归。\n归来见天子，天子坐明堂。\n策勋十二转，赏赐百千强。\n可汗问所欲，木兰不用尚书郎。\n愿驰千里足，送儿还故乡。"],["木兰诗·第四段","北朝民歌·佚名","爷娘闻女来，出郭相扶将；\n阿姊闻妹来，当户理红妆；\n小弟闻姊来，磨刀霍霍向猪羊。\n开我东阁门，坐我西阁床。\n脱我战时袍，著我旧时裳。\n当窗理云鬓，对镜帖花黄。\n出门看火伴，火伴皆惊忙： 同行十二年，不知木兰是女郎。\n雄兔脚扑朔，雌兔眼迷离；\n双兔傍地走，安能辨我是雄雌？"],["玩月城西门廨中","南朝宋·鲍照","始出西南楼，纤纤如玉钩。\n末映东北墀，娟娟似蛾眉。\n蛾眉蔽珠栊，玉钩隔琐窗。\n三五二八时，千里与君同。\n夜移衡汉落，徘徊帷户中。\n归华先委露，别叶早辞风。\n客游厌苦辛，仕子倦飘尘。\n休澣自公日，宴慰及私辰。\n蜀琴抽白雪，郢曲发阳春。\n肴干酒未阕，金壶启夕沦。\n回轩驻轻盖，留酌待情人。"],["后出塞五首·其一","唐·杜甫","男儿生世间，及壮当封侯。\n战伐有功业，焉能守旧丘？\n召募赴蓟门，军动不可留。\n千金买马鞍，百金装刀头。\n闾里送我行，亲戚拥道周。\n斑白居上列，酒酣进庶羞。\n少年别有赠，含笑看吴钩。"],["后出塞五首·其二","唐·杜甫","朝进东门营，暮上河阳桥。\n落日照大旗，马鸣风萧萧。\n平沙列万幕，部伍各见招。\n中天悬明月，令严夜寂寥。\n悲笳数声动，壮士惨不骄。\n借问大将谁？恐是霍嫖姚。"],["后出塞五首·其三","唐·杜甫","古人重守边，今人重高勋。\n岂知英雄主，出师亘长云。\n六合已一家，四夷且孤军。\n遂使貔虎士，奋身勇所闻。\n拔剑击大荒，日收胡马群。\n誓开玄冥北，持以奉吾君！"],["后出塞五首·其四","唐·杜甫","献凯日继踵，两蕃静无虞。\n渔阳豪侠地，击鼓吹笙竽。\n云帆转辽海，粳稻来东吴。\n越罗与楚练，照耀舆台躯。\n主将位益崇，气骄凌上都。\n边人不敢议，议者死路衢。"],["后出塞五首·其五","唐·杜甫","我本良家子，出师亦多门。\n将骄益愁思，身贵不足论。\n跃马二十年，恐辜明主恩。\n坐见幽州骑，长驱河洛昏。\n中夜间道归，故里但空村。\n恶名幸脱免，穷老无儿孙。"],["秦州杂诗二十首·其一","唐·杜甫","满目悲生事，因人作远游。\n迟回度陇怯，浩荡及关愁。\n水落鱼龙夜，山空鸟鼠秋。\n西征问烽火，心折此淹留。"],["秦州杂诗二十首·其二","唐·杜甫","秦州山北寺，胜迹隗嚣宫。\n苔藓山门古，丹青野殿空。\n月明垂叶露，云逐渡溪风。\n清渭无情极，愁时独向东。"],["秦州杂诗二十首·其三","唐·杜甫","州图领同谷，驿道出流沙。\n降虏兼千帐，居人有万家。\n马骄珠汗落，胡舞白蹄斜。\n年少临洮子，西来亦自夸。"],["秦州杂诗二十首·其四","唐·杜甫","鼓角缘边郡，川原欲夜时。\n秋听殷地发，风散入云悲。\n抱叶寒蝉静，归来独鸟迟。\n万方声一概，吾道竟何之。"],["秦州杂诗二十首·其五","唐·杜甫","南使宜天马，由来万匹强。\n浮云连阵没，秋草遍山长。\n闻说真龙种，仍残老骕骦。\n哀鸣思战斗，迥立向苍苍。"],["秦州杂诗二十首·其六","唐·杜甫","城上胡笳奏，山边汉节归。\n防河赴沧海，奉诏发金微。\n士苦形骸黑，旌疏鸟兽稀。\n那闻往来戍，恨解邺城围。"],["秦州杂诗二十首·其八","唐·杜甫","闻道寻源使，从天此路回。\n牵牛去几许，宛马至今来。\n一望幽燕隔，何时郡国开。\n东征健儿尽，羌笛暮吹哀。"],["秦州杂诗二十首·其九","唐·杜甫","今日明人眼，临池好驿亭。\n丛篁低地碧，高柳半天青。\n稠叠多幽事，喧呼阅使星。\n老夫如有此，不异在郊坰。"],["秦州杂诗二十首·其十","唐·杜甫","云气接昆仑，涔涔塞雨繁。\n羌童看渭水，使客向河源。\n烟火军中幕，牛羊岭上村。\n所居秋草净，正闭小蓬门。"],["秦州杂诗二十首·其十一","唐·杜甫","萧萧古塞冷，漠漠秋云低。\n黄鹄翅垂雨，苍鹰饥啄泥。\n蓟门谁自北，汉将独征西。\n不意书生耳，临衰厌鼓鼙。"],["秦州杂诗二十首·其十二","唐·杜甫","山头南郭寺，水号北流泉。\n老树空庭得，清渠一邑传。\n秋花危石底，晚景卧钟边。\n俯仰悲身世，溪风为飒然。"],["秦州杂诗二十首·其十三","唐·杜甫","传道东柯谷，深藏数十家。\n对门藤盖瓦，映竹水穿沙。\n瘦地翻宜粟，阳坡可种瓜。\n船人近相报，但恐失桃花。"],["秦州杂诗二十首·其十四","唐·杜甫","万古仇池穴，潜通小有天。\n神鱼人不见，福地语真传。\n近接西南境，长怀十九泉。\n何时一茅屋，送老白云边。"],["秦州杂诗二十首·其十五","唐·杜甫","未暇泛沧海，悠悠兵马间。\n塞门风落木，客舍雨连山。\n阮籍行多兴，庞公隐不还。\n东柯遂疏懒，休镊鬓毛斑。"],["秦州杂诗二十首·其十六","唐·杜甫","东柯好崖谷，不与众峰群。\n落日邀双鸟，晴天养片云。\n野人矜险绝，水竹会平分。\n采药吾将老，儿童未遣闻。"],["秦州杂诗二十首·其十七","唐·杜甫","边秋阴易久，不复辨晨光。\n檐雨乱淋幔，山云低度墙。\n鸬鹚窥浅井，蚯蚓上深堂。\n车马何萧索，门前百草长。"],["秦州杂诗二十首·其十八","唐·杜甫","地僻秋将尽，山高客未归。\n塞云多断续，边日少光辉。\n警急烽常报，传闻檄屡飞。\n西戎外甥国，何得迕天威。"],["秦州杂诗二十首·其十九","唐·杜甫","凤林戈未息，鱼海路常难。\n候火云烽峻，悬军幕井干。\n风连西极动，月过北庭寒。\n故老思飞将，何时议筑坛。"],["秦州杂诗二十首·其二十","唐·杜甫","唐尧真自圣，野老复何知。\n晒药能无妇，应门幸有儿。\n藏书闻禹穴，读记忆仇池。\n为报鸳行旧，鹪鹩在一枝。"],["水龙吟·甲辰岁寿韩南涧尚书","宋·辛弃疾","渡江天马南来，几人真是经纶手。\n长安父老，新亭风景，可怜依旧。\n夷甫诸人，神州陆沉，几曾回首。\n算平戎万里，功名本是，真儒事、君知否。\n况有文章山斗，对桐阴、满庭清昼。\n当年堕地，而今试看，风云奔走。\n绿野风烟，平泉草木，东山歌酒。\n待他年，整顿乾坤事了，为先生寿。"],["正气歌·第一段","宋·文天祥","天地有正气，杂然赋流形。\n下则为河岳，上则为日星。\n于人曰浩然，沛乎塞苍冥。\n皇路当清夷，含和吐明庭。\n时穷节乃见，一一垂丹青。"],["正气歌·第二段","宋·文天祥","在齐太史简，在晋董狐笔。\n在秦张良椎，在汉苏武节。\n为严将军头，为嵇侍中血。\n为张睢阳齿，为颜常山舌。\n或为辽东帽，清操厉冰雪。\n或为出师表，鬼神泣壮烈。\n或为渡江楫，慷慨吞胡羯。\n或为击贼笏，逆竖头破裂。\n是气所磅礴，凛烈万古存。\n当其贯日月，生死安足论。\n地维赖以立，天柱赖以尊。\n三纲实系命，道义为之根。"],["正气歌·第三段","宋·文天祥","嗟予遘阳九，隶也实不力。\n楚囚缨其冠，传车送穷北。\n鼎镬甘如饴，求之不可得。\n阴房阗鬼火，春院閟天黑。\n牛骥同一皂，鸡栖凤凰食。\n一朝蒙雾露，分作沟中瘠。\n如此再寒暑，百沴自辟易。\n嗟哉沮洳场，为我安乐国。\n岂有他缪巧，阴阳不能贼。\n顾此耿耿在，仰视浮云白。\n悠悠我心悲，苍天曷有极。\n哲人日已远，典刑在夙昔。\n风檐展书读，古道照颜色。"],["金陵驿二首·其二","宋·文天祥","万里金瓯失壮图，衮衣颠倒落泥涂。\n空流杜宇声中血，半脱骊龙颔下须。\n老去秋风吹我恶，梦回寒月照人孤。\n千年成败俱尘土，消得人间说丈夫。"]];

 const box=$('learned-list');box.replaceChildren();const entries=poems.map((poem,i)=>({poem,i})).filter(({i})=>isLearned(i));$('learned-summary').textContent=`已学会 · ${entries.length} 首`;
 if(!entries.length){const p=document.createElement('p');p.className='empty';p.textContent='标记已学会的诗词会在这里，可以随时恢复。';box.append(p)}
 for(const {poem,i} of entries){const row=document.createElement('div');row.className='learned-row';const label=document.createElement('span');label.textContent=`《${poem[0]}》 · ${poem[1]}`;const button=document.createElement('button');button.type='button';button.className='restore';button.textContent='恢复';button.setAttribute('aria-label',`恢复《${poem[0]}》到播放列表`);button.onclick=()=>{delete learned[poemId(poem)];saveLearned();render()};row.append(label,button);box.append(row)}}
try{index=Math.max(0,Math.min(poems.length-1,Number(localStorage.getItem('shinan-poetry-level45-125-index'))||0));$('rate').value='0.8'}catch{}
function status(s){$('status').textContent=s}function stop(){playing=false;token++;if(synth)synth.cancel();currentUtterance=null;$('play').textContent='▶ 播放朗读'}
function list(){const q=$('search').value.trim();$('list').replaceChildren();poems.forEach((p,i)=>{if(isLearned(i)||q&&!`${p[0]}${p[1]}`.includes(q))return;const b=document.createElement('button');b.className='pick'+(i===index?' current':'');b.setAttribute('aria-current',i===index?'true':'false');const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');const t=document.createElement('span');t.textContent=p[0];b.append(n,t);b.onclick=()=>choose(i);$('list').append(b)});if(!$('list').children.length){const p=document.createElement('p');p.className='empty';p.textContent=availableCount()?'没有找到这首诗':'播放列表已清空，请在下方恢复已学会的诗词';$('list').append(p)}}
function render(){const p=poems[index];$('title').textContent=p[0];$('author').textContent=p[1];$('counter').textContent=`${String(index+1).padStart(2,'0')} / ${poems.length} 首`;$('verses').replaceChildren();p[2].split('\n').forEach((text,i)=>{const e=document.createElement('p');e.className='verse';e.dataset.line=i+2;e.textContent=text;$('verses').append(e)});list();renderLearned();try{localStorage.setItem('shinan-poetry-level45-125-index',index)}catch{}highlight()}
function highlight(){document.querySelectorAll('.verse').forEach(e=>e.classList.toggle('active',playing&&Number(e.dataset.line)===line))}
function choose(i,step=1){if(!availableCount()){noUnlearned();return}const resume=playing;stop();const target=(i+poems.length)%poems.length;index=isLearned(target)?nextAvailable((target-step+poems.length)%poems.length,step):target;line=0;render();status('已切换至《'+poems[index][0]+'》');if(resume)start()}
// Pronunciation changes affect speech only; the displayed sheet text is unchanged.
const pronunciationAliases=[["其一","其衣"],["第一","第衣"],["十一月","十衣月"],["一一垂丹青","衣衣垂丹青"],["一片","宜片"],["一月","宜月"],["一日","宜日"],["一雁","宜雁"],["一段","宜段"],["一色","宜色"],["一度","宜度"],["一再","宜再"],["一万","宜万"],["一切","宜切"],["一胜","宜胜"],["一鹤","宜鹤"],["一夜","宜夜"],["一概","宜概"],["一望","宜望"],["一邑","宜邑"],["一皂","宜皂"],["一夕","义夕"],["一统","义统"],["一江","义江"],["一山","义山"],["一表","义表"],["一樽","义樽"],["一饷","义饷"],["一秦","义秦"],["一何","义何"],["一村","义村"],["一览","义览"],["一帆","义帆"],["一家","义家"],["一茅","义茅"],["一枝","义枝"],["一朝","义朝"],["欲问行人去那边","欲问行人去哪边"],["清平乐","清平月"],["换得","换德"],["少小去乡邑","绍小去乡邑"],["驱马天雨雪","驱马天玉雪"],["岑参","岑深"],["岱宗夫如何","岱宗伏如何"],["昨夜见军帖","昨夜见军铁"],["胡骑鸣","胡计鸣"],["鸣溅溅","鸣尖尖"],["送儿还故乡","送儿环故乡"],["著我旧时裳","卓我旧时常"],["朝进东门营","昭进东门营"],["气骄凌上都","气骄凌上督"],["坐见幽州骑","坐见幽州计"],["那闻往来戍","哪闻往来戍"],["塞门风落木","赛门风落木"],["门前百草长","门前百草掌"],["应门幸有儿","映门幸有儿"],["事了","事蓼"],["塞苍冥","瑟苍冥"],["萧萧古塞冷","萧萧古赛冷"],["溪风为飒然","溪风魏飒然"],["时穷节乃见","时穷节乃现"],["他缪巧","他谬巧"],["长歌行","常歌行"]];
function spokenTitle(title, content){
  const parts=title.split('·');
  if(parts.length===2 && content.trim().startsWith(parts[1]))return parts[0];
  return title.replace(/^(.+?)[一二三四五六七八九十百]+首·(其[一二三四五六七八九十百]+)$/,'$1$2')
}
function speechText(text){
  for(const [original,alias] of pronunciationAliases)text=text.replaceAll(original,alias);
  text=text.replaceAll('得','德');
  return text
}
function start(){if(!synth)return;if(!availableCount()){noUnlearned();return}if(isLearned(index)){stop();index=nextAvailable(index,1);line=0;render()}stop();playing=true;const my=token;$('play').textContent='Ⅱ 暂停朗读';function speak(){if(!playing||my!==token)return;const p=poems[index],segments=[p[0],p[1].replace('·','，'),...p[2].split('\n')];segments[0]=spokenTitle(p[0],p[2]);if(line>=segments.length){line=0;highlight();if($('loop').checked||$('auto').checked){status($('loop').checked?'本首朗读完成 · 1秒后再次朗读':'本首朗读完成 · 1秒后播放下一首');setTimeout(()=>{if(my!==token||!playing)return;if(!$('auto').checked&&!$('loop').checked){stop();highlight();status('本首朗读完成');return}if(!$('loop').checked)index=nextAvailable(index,1);render();start()},1000)}else{playing=false;$('play').textContent='↻ 再听一遍';highlight();status($('auto').checked?'125首已全部朗读完成':'本首朗读完成')}return}highlight();status(line<2?'正在朗读诗名与作者':'正在朗读 · 第'+(line-1)+'句');const u=new SpeechSynthesisUtterance(speechText(segments[line]));currentUtterance=u;u.lang='zh-CN';u.rate=Number($('rate').value);const selected=voices.find(v=>v.voiceURI===$('voice').value);if(selected)u.voice=selected;u.onend=()=>{if(my!==token||!playing)return;line++;speak()};u.onerror=e=>{if(my!==token||e.error==='canceled'||e.error==='interrupted')return;stop();highlight();status('朗读未能启动，请重新点击播放，或换一个中文声音。')};synth.speak(u)}speak()}
$('play').onclick=()=>{if(playing){stop();highlight();status('已暂停 · 再次播放从当前句继续')}else start()};$('prev').onclick=()=>choose(index-1,-1);$('next').onclick=()=>choose(index+1,1);$('restart').onclick=()=>{line=0;start()};$('hide').onclick=()=>{const hide=$('reading').classList.toggle('hidden');$('hide').textContent=hide?'显示正文':'隐藏正文';$('hide').setAttribute('aria-pressed',String(hide))};$('rate').onchange=()=>{try{localStorage.setItem('shinan-poetry-level45-125-rate',$('rate').value)}catch{}if(playing)start()};$('voice').onchange=()=>{if(playing)start()};$('search').oninput=list;$('learned').onclick=()=>{const id=poemId(poems[index]);if(learned[id])delete learned[id];else learned[id]=true;saveLearned();if(isLearned(index)&&playing){if(!availableCount()){noUnlearned();render()}else choose(index+1,1)}else render()};
$('auto').onchange=()=>{if($('auto').checked)$('loop').checked=false};$('loop').onchange=()=>{if($('loop').checked)$('auto').checked=false};
function loadVoices(){if(!synth)return;const old=$('voice').value;voices=synth.getVoices().filter(v=>/^zh|cmn|yue/i.test(v.lang));document.querySelector('.voicewrap').hidden=voices.length<=1;$('voice').replaceChildren();const a=document.createElement('option');a.value='';a.textContent='设备默认中文';$('voice').append(a);voices.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name;$('voice').append(o)});if(voices.some(v=>v.voiceURI===old))$('voice').value=old;else{const mainland=voices.find(v=>/^zh[-_]CN$|^cmn[-_]CN/i.test(v.lang));if(mainland)$('voice').value=mainland.voiceURI}}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices()}else{$('play').disabled=true;$('restart').disabled=true;status('当前浏览器不支持语音朗读，请用 Safari 或 Chrome 打开。')}window.addEventListener('pagehide',()=>{stop()});if(isLearned(index)&&availableCount())index=nextAvailable(index,1);render();
</script></body></html>
