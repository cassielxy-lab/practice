const poems=[["嫦娥","唐·李商隐","云母屏风烛影深，长河渐落晓星沉。\n嫦娥应悔偷灵药，碧海青天夜夜心。"],["三衢道中","宋·曾几","梅子黄时日日晴，小溪泛尽却山行。\n绿阴不减来时路，添得黄鹂四五声。"],["雪梅二首·其一","宋·卢钺","梅雪争春未肯降，骚人阁笔费评章。\n梅须逊雪三分白，雪却输梅一段香。"],["四时田园杂兴六十首·其二十五","宋·范成大","梅子金黄杏子肥，麦花雪白菜花稀。\n日长篱落无人过，惟有蜻蜓蛱蝶飞。"],["清平乐·村居","宋·辛弃疾","茅檐低小，溪上青青草。\n醉里吴音相媚好，白发谁家翁媪？\n大儿锄豆溪东，中儿正织鸡笼。\n最喜小儿亡赖，溪头卧剥莲蓬。"],["江畔独步寻花七首·其五","唐·杜甫","黄师塔前江水东，春光懒困倚微风。\n桃花一簇开无主，可爱深红爱浅红？"],["汉江临眺","唐·王维","楚塞三湘接，荆门九派通。\n江流天地外，山色有无中。\n郡邑浮前浦，波澜动远空。\n襄阳好风日，留醉与山翁。"],["无题·大江歌罢掉头东","近现代·周恩来","大江歌罢掉头东，邃密群科济世穷。\n面壁十年图破壁，难酬蹈海亦英雄。"],["浪淘沙九首·其七","唐·刘禹锡","八月涛声吼地来，头高数丈触山回。\n须臾却入海门去，卷起沙堆似雪堆。"],["卜算子·咏梅","近现代·毛泽东","风雨送春归，飞雪迎春到。\n已是悬崖百丈冰，犹有花枝俏。\n俏也不争春，只把春来报。\n待到山花烂漫时，她在丛中笑。"],["蜂","唐·罗隐","不论平地与山尖，无限风光尽被占。\n采得百花成蜜后，为谁辛苦为谁甜？"],["夜书所见","宋·叶绍翁","萧萧梧叶送寒声，江上秋风动客情。\n知有儿童挑促织，夜深篱落一灯明。"],["滁州西涧","唐·韦应物","独怜幽草涧边生，上有黄鹂深树鸣。\n春潮带雨晚来急，野渡无人舟自横。"],["题西林壁","宋·苏轼","横看成岭侧成峰，远近高低各不同。\n不识庐山真面目，只缘身在此山中。"],["九月九日忆山东兄弟","唐·王维","独在异乡为异客，每逢佳节倍思亲。\n遥知兄弟登高处，遍插茱萸少一人。"],["望天门山","唐·李白","天门中断楚江开，碧水东流至此回。\n两岸青山相对出，孤帆一片日边来。"],["芙蓉楼送辛渐二首·其一","唐·王昌龄","寒雨连江夜入吴，平明送客楚山孤。\n洛阳亲友如相问，一片冰心在玉壶。"],["出塞二首·其一","唐·王昌龄","秦时明月汉时关，万里长征人未还。\n但使龙城飞将在，不教胡马度阴山。"],["元日","宋·王安石","爆竹声中一岁除，春风送暖入屠苏。\n千门万户曈曈日，总把新桃换旧符。"],["宿新市徐公店二首·其二","宋·杨万里","篱落疏疏一径深，树头新绿未成阴。\n儿童急走追黄蝶，飞入菜花无处寻。"],["惠崇春江晚景二首·其一","宋·苏轼","竹外桃花三两枝，春江水暖鸭先知。\n蒌蒿满地芦芽短，正是河豚欲上时。"],["饮湖上初晴后雨二首·其二","宋·苏轼","水光潋滟晴方好，山色空蒙雨亦奇。\n欲把西湖比西子，淡妆浓抹总相宜。"],["暮江吟","唐·白居易","一道残阳铺水中，半江瑟瑟半江红。\n可怜九月初三夜，露似真珠月似弓。"],["采莲曲二首·其二","唐·王昌龄","荷叶罗裙一色裁，芙蓉向脸两边开。\n乱入池中看不见，闻歌始觉有人来。"],["夏日绝句","宋·李清照","生当作人杰，死亦为鬼雄。\n至今思项羽，不肯过江东。"],["望洞庭","唐·刘禹锡","湖光秋月两相和，潭面无风镜未磨。\n遥望洞庭山水翠，白银盘里一青螺。"],["墨梅","元·王冕","吾家洗砚池头树，个个花开淡墨痕。\n不要人夸好颜色，只留清气满乾坤。"],["独坐敬亭山","唐·李白","众鸟高飞尽，孤云独去闲。\n相看两不厌，只有敬亭山。"],["别董大二首·其一","唐·高适","千里黄云白日曛，北风吹雁雪纷纷。\n莫愁前路无知己，天下谁人不识君？"],["忆江南三首·其一","唐·白居易","江南好，风景旧曾谙。\n日出江花红胜火，春来江水绿如蓝。\n能不忆江南？"],["所见","清·袁枚","牧童骑黄牛，歌声振林樾。\n意欲捕鸣蝉，忽然闭口立。"],["早发白帝城","唐·李白","朝辞白帝彩云间，千里江陵一日还。\n两岸猿声啼不住，轻舟已过万重山。"],["凉州词·葡萄美酒夜光杯","唐·王翰","葡萄美酒夜光杯，欲饮琵琶马上催。\n醉卧沙场君莫笑，古来征战几人回？"],["绝句·迟日江山丽","唐·杜甫","迟日江山丽，春风花草香。\n泥融飞燕子，沙暖睡鸳鸯。"],["清明","唐·杜牧","清明时节雨纷纷，路上行人欲断魂。\n借问酒家何处有？牧童遥指杏花村。"],["大林寺桃花","唐·白居易","人间四月芳菲尽，山寺桃花始盛开。\n长恨春归无觅处，不知转入此中来。"],["山行","唐·杜牧","远上寒山石径斜，白云生处有人家。\n停车坐爱枫林晚，霜叶红于二月花。"],["鹿柴","唐·王维","空山不见人，但闻人语响。\n返景入深林，复照青苔上。"],["和张仆射塞下曲六首·其三","唐·卢纶","月黑雁飞高，单于夜遁逃。\n欲将轻骑逐，大雪满弓刀。"],["赠刘景文","宋·苏轼","荷尽已无擎雨盖，菊残犹有傲霜枝。\n一年好景君须记，最是橙黄橘绿时。"],["杏帘在望","清·曹雪芹","杏帘招客饮，在望有山庄。\n菱荇鹅儿水，桑榆燕子梁。\n一畦春韭绿，十里稻花香。\n盛世无饥馁，何须耕织忙。"]];
const $=id=>document.getElementById(id);const synth=window.speechSynthesis;let index=0,line=0,playing=false,token=0,currentUtterance=null,voices=[];

try{const saved=JSON.parse(localStorage.getItem(learnedKey)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))learned=saved}catch{}
const poemId=p=>p[0]+'｜'+p[1];
const isLearned=i=>Boolean(learned[poemId(poems[i])]);

function saveLearned(){try{localStorage.setItem(learnedKey,JSON.stringify(learned))}catch{}}
function nextAvailable(from,step){for(let offset=1;offset<=poems.length;offset++){const i=(from+step*offset+poems.length*2)%poems.length;if(!isLearned(i))return i}return null}
function noUnlearned(){stop();status('这一批都已标为学会，可在下方“已学会”列表恢复。')}
function renderLearned(){const marked=isLearned(index);$('learned').textContent=marked?'↺ 恢复到播放列表':'✓ 标为已学会';$('learned').setAttribute('aria-pressed',String(marked));$('catalog-summary').textContent=`播放列表 · ${availableCount()} 首`;
 const box=$('learned-list');box.replaceChildren();const entries=poems.map((poem,i)=>({poem,i})).filter(({i})=>isLearned(i));$('learned-summary').textContent=`已学会 · ${entries.length} 首`;
 if(!entries.length){const p=document.createElement('p');p.className='empty';p.textContent='标记已学会的诗词会在这里，可以随时恢复。';box.append(p)}
 for(const {poem,i} of entries){const row=document.createElement('div');row.className='learned-row';const label=document.createElement('span');label.textContent=`《${poem[0]}》 · ${poem[1]}`;const button=document.createElement('button');button.type='button';button.className='restore';button.textContent='恢复';button.setAttribute('aria-label',`恢复《${poem[0]}》到播放列表`);button.onclick=()=>{delete learned[poemId(poem)];saveLearned();render()};row.append(label,button);box.append(row)}}

function list(){const q=$('search').value.trim();$('list').replaceChildren();poems.forEach((p,i)=>{if(isLearned(i)||q&&!`${p[0]}${p[1]}`.includes(q))return;const b=document.createElement('button');b.className='pick'+(i===index?' current':'');b.setAttribute('aria-current',i===index?'true':'false');const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');const t=document.createElement('span');t.textContent=p[0];b.append(n,t);b.onclick=()=>choose(i);$('list').append(b)});if(!$('list').children.length){const p=document.createElement('p');p.className='empty';p.textContent=availableCount()?'没有找到这首诗':'播放列表已清空，请在下方恢复已学会的诗词';$('list').append(p)}}
function render(){const p=poems[index];$('title').textContent=p[0];$('author').textContent=p[1];$('counter').textContent=`${String(index+1).padStart(2,'0')} / ${poems.length} 首`;$('verses').replaceChildren();p[2].split('\n').forEach((text,i)=>{const e=document.createElement('p');e.className='verse';e.dataset.line=i+2;e.textContent=text;$('verses').append(e)});list();renderLearned();try{localStorage.setItem('shinan-poetry-level2-41-index',index)}catch{}highlight()}

function speechText(text){
  text=spokenTitles[text]||text; // The visible title keeps its first-line hint.
  // Omit the collection size only when speaking titles like 雪梅二首·其一.
  text=text.replace(/^(.+?)[一二三四五六七八九十百]+首·(其[一二三四五六七八九十百]+)$/,'$1$2');
  for(const [original,alias] of pronunciationAliases)text=text.replaceAll(original,alias);
  return text
}
function groupInfo(title){return title.match(/^(前出塞九首|后出塞五首|秦州杂诗二十首)·其(.+)$/)}
function start(){if(!synth)return;if(!availableCount()){noUnlearned();return}if(isLearned(index)){stop();index=nextAvailable(index,1);line=0;render()}stop();playing=true;const my=token;$('play').textContent='Ⅱ 暂停朗读';function speak(){if(!playing||my!==token)return;const p=poems[index],segments=[p[0],p[1].replace('·','，'),...p[2].split('\n')];const group=groupInfo(p[0]);if(group){if(group[2]==='一')segments[0]=group[1];else if(line<2)line=2}if(line>=segments.length){line=0;highlight();if($('loop').checked||$('auto').checked){status($('loop').checked?'本首朗读完成 · 1秒后再次朗读':'本首朗读完成 · 1秒后播放下一首');setTimeout(()=>{if(my!==token||!playing)return;if(!$('auto').checked&&!$('loop').checked){stop();highlight();status('本首朗读完成');return}if(!$('loop').checked)index=nextAvailable(index,1);render();start()},1000)}else{playing=false;$('play').textContent='↻ 再听一遍';highlight();status($('auto').checked?'41首已全部朗读完成':'本首朗读完成')}return}highlight();status(line<2?'正在朗读诗名与作者':'正在朗读 · 第'+(line-1)+'句');const u=new SpeechSynthesisUtterance(speechText(segments[line]));currentUtterance=u;u.lang='zh-CN';u.rate=Number($('rate').value);const selected=voices.find(v=>v.voiceURI===$('voice').value);if(selected)u.voice=selected;u.onend=()=>{if(my!==token||!playing)return;line++;speak()};u.onerror=e=>{if(my!==token||e.error==='canceled'||e.error==='interrupted')return;stop();highlight();status('朗读未能启动，请重新点击播放，或换一个中文声音。')};synth.speak(u)}speak()}
$('play').onclick=()=>{if(playing){stop();highlight();status('已暂停 · 再次播放从当前句继续')}else start()};$('prev').onclick=()=>choose(index-1,-1);$('next').onclick=()=>choose(index+1,1);$('restart').onclick=()=>{line=0;start()};$('hide').onclick=()=>{const hide=$('reading').classList.toggle('hidden');$('hide').textContent=hide?'显示正文':'隐藏正文';$('hide').setAttribute('aria-pressed',String(hide))};$('rate').onchange=()=>{try{localStorage.setItem('shinan-poetry-level2-41-rate',$('rate').value)}catch{}if(playing)start()};$('voice').onchange=()=>{if(playing)start()};$('search').oninput=list;$('learned').onclick=()=>{const id=poemId(poems[index]);if(learned[id])delete learned[id];else learned[id]=true;saveLearned();if(isLearned(index)&&playing){if(!availableCount()){noUnlearned();render()}else choose(index+1,1)}else render()};
$('auto').onchange=()=>{if($('auto').checked)$('loop').checked=false};$('loop').onchange=()=>{if($('loop').checked)$('auto').checked=false};
function loadVoices(){if(!synth)return;const old=$('voice').value;voices=synth.getVoices().filter(v=>/^zh|cmn|yue/i.test(v.lang));document.querySelector('.voicewrap').hidden=voices.length<=1;$('voice').replaceChildren();const a=document.createElement('option');a.value='';a.textContent='设备默认中文';$('voice').append(a);voices.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name;$('voice').append(o)});if(voices.some(v=>v.voiceURI===old))$('voice').value=old;else{const mainland=voices.find(v=>/^zh[-_]CN$|^cmn[-_]CN/i.test(v.lang));if(mainland)$('voice').value=mainland.voiceURI}}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices()}else{$('play').disabled=true;$('restart').disabled=true;status('当前浏览器不支持语音朗读，请用 Safari 或 Chrome 打开。')}window.addEventListener('pagehide',()=>{stop()});if(isLearned(index)&&availableCount())index=nextAvailable(index,1);render();
</script></body></html>
