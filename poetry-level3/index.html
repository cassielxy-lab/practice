const poems=[["书湖阴先生壁二首·其一","宋·王安石","茅檐长扫净无苔，花木成畦手自栽。\n一水护田将绿绕，两山排闼送青来。"],["观书有感二首·其二","宋·朱熹","昨夜江边春水生，艨艟巨舰一毛轻。\n向来枉费推移力，此日中流自在行。"],["西江月·夜行黄沙道中","宋·辛弃疾","明月别枝惊鹊，清风半夜鸣蝉。\n稻花香里说丰年，听取蛙声一片。\n七八个星天外，两三点雨山前。\n旧时茅店社林边，路转溪桥忽见。"],["稚子弄冰","宋·杨万里","稚子金盆脱晓冰，彩丝穿取当银钲。\n敲成玉磬穿林响，忽作玻璃碎地声。"],["马诗二十三首·其五","唐·李贺","大漠沙如雪，燕山月似钩。\n何当金络脑，快走踏清秋。"],["乞巧","唐·林杰","七夕今宵看碧霄，牵牛织女渡河桥。\n家家乞巧望秋月，穿尽红丝几万条。"],["长相思·山一程","清·纳兰性德","山一程，水一程，\n身向榆关那畔行，夜深千帐灯。\n风一更，雪一更，\n聒碎乡心梦不成，故园无此声。"],["七律·长征","近现代·毛泽东","红军不怕远征难，万水千山只等闲。\n五岭逶迤腾细浪，乌蒙磅礴走泥丸。\n金沙水拍云崖暖，大渡桥横铁索寒。\n更喜岷山千里雪，三军过后尽开颜。"],["采薇·节选","《诗经·小雅》","昔我往矣，杨柳依依。\n今我来思，雨雪霏霏。\n行道迟迟，载渴载饥。\n我心伤悲，莫知我哀！"],["人日立春","唐·卢仝","春度春归无限春，今朝方始觉成人。\n从今克己应犹及，颜与梅花俱自新。"],["黄鹤楼送孟浩然之广陵","唐·李白","故人西辞黄鹤楼，烟花三月下扬州。\n孤帆远影碧空尽，唯见长江天际流。"],["己亥杂诗·九州生气恃风雷","清·龚自珍","九州生气恃风雷，万马齐喑究可哀。\n我劝天公重抖擞，不拘一格降人才。"],["闻官军收河南河北","唐·杜甫","剑外忽传收蓟北，初闻涕泪满衣裳。\n却看妻子愁何在，漫卷诗书喜欲狂。\n白日放歌须纵酒，青春作伴好还乡。\n即从巴峡穿巫峡，便下襄阳向洛阳。"],["村晚","宋·雷震","草满池塘水满陂，山衔落日浸寒漪。\n牧童归去横牛背，短笛无腔信口吹。"],["迢迢牵牛星","《古诗十九首》","迢迢牵牛星，皎皎河汉女。\n纤纤擢素手，札札弄机杼。\n终日不成章，泣涕零如雨。\n河汉清且浅，相去复几许？\n盈盈一水间，脉脉不得语。"],["蝉","唐·虞世南","垂緌饮清露，流响出疏桐。\n居高声自远，非是藉秋风。"],["山居秋暝","唐·王维","空山新雨后，天气晚来秋。\n明月松间照，清泉石上流。\n竹喧归浣女，莲动下渔舟。\n随意春芳歇，王孙自可留。"],["十五夜望月","唐·王建","中庭地白树栖鸦，冷露无声湿桂花。\n今夜月明人尽望，不知秋思落谁家。"],["鲁山山行","宋·梅尧臣","适与野情惬，千山高复低。\n好峰随处改，幽径独行迷。\n霜落熊升树，林空鹿饮溪。\n人家在何许？云外一声鸡。"],["淮中晚泊犊头","宋·苏舜钦","春阴垂野草青青，时有幽花一树明。\n晚泊孤舟古祠下，满川风雨看潮生。"],["过故人庄","唐·孟浩然","故人具鸡黍，邀我至田家。\n绿树村边合，青山郭外斜。\n开轩面场圃，把酒话桑麻。\n待到重阳日，还来就菊花。"],["凉州词·黄河远上白云间","唐·王之涣","黄河远上白云间，一片孤城万仞山。\n羌笛何须怨杨柳，春风不度玉门关。"],["示儿","宋·陆游","死去元知万事空，但悲不见九州同。\n王师北定中原日，家祭无忘告乃翁。"],["送元二使安西","唐·王维","渭城朝雨浥轻尘，客舍青青柳色新。\n劝君更尽一杯酒，西出阳关无故人。"],["石灰吟","明·于谦","千锤万凿出深山，烈火焚烧若等闲。\n粉骨碎身浑不怕，要留清白在人间。"],["渔歌子·西塞山前白鹭飞","唐·张志和","西塞山前白鹭飞，\n桃花流水鳜鱼肥。\n青箬笠，绿蓑衣，\n斜风细雨不须归。"],["早春呈水部张十八员外二首·其一","唐·韩愈","天街小雨润如酥，草色遥看近却无。\n最是一年春好处，绝胜烟柳满皇都。"],["寒食","唐·韩翃","春城无处不飞花，寒食东风御柳斜。\n日暮汉宫传蜡烛，轻烟散入五侯家。"],["题临安邸","宋·林升","山外青山楼外楼，西湖歌舞几时休？\n暖风熏得游人醉，直把杭州作汴州。"],["泊船瓜洲","宋·王安石","京口瓜洲一水间，钟山只隔数重山。\n春风又绿江南岸，明月何时照我还？"],["鸟鸣涧","唐·王维","人闲桂花落，夜静春山空。\n月出惊山鸟，时鸣春涧中。"],["浪淘沙九首·其一","唐·刘禹锡","九曲黄河万里沙，浪淘风簸自天涯。\n如今直上银河去，同到牵牛织女家。"],["宿建德江","唐·孟浩然","移舟泊烟渚，日暮客愁新。\n野旷天低树，江清月近人。"],["六月二十七日望湖楼醉书五首·其一","宋·苏轼","黑云翻墨未遮山，白雨跳珠乱入船。\n卷地风来忽吹散，望湖楼下水如天。"],["江南春","唐·杜牧","千里莺啼绿映红，水村山郭酒旗风。\n南朝四百八十寺，多少楼台烟雨中。"],["观书有感二首·其一","宋·朱熹","半亩方塘一鉴开，天光云影共徘徊。\n问渠那得清如许？为有源头活水来。"],["绝句·江碧鸟逾白","唐·杜甫","江碧鸟逾白，山青花欲燃。\n今春看又过，何日是归年？"],["竹石","清·郑燮","咬定青山不放松，立根原在破岩中。\n千磨万击还坚劲，任尔东西南北风。"],["乡村四月","宋·翁卷","绿遍山原白满川，子规声里雨如烟。\n乡村四月闲人少，才了蚕桑又插田。"],["四时田园杂兴六十首·其三十一","宋·范成大","昼出耘田夜绩麻，村庄儿女各当家。\n童孙未解供耕织，也傍桑阴学种瓜。"],["江上渔者","宋·范仲淹","江上往来人，但爱鲈鱼美。\n君看一叶舟，出没风波里。"],["回乡偶书二首·其一","唐·贺知章","少小离家老大回，乡音无改鬓毛衰。\n儿童相见不相识，笑问客从何处来。"],["游园不值","宋·叶绍翁","应怜屐齿印苍苔，小扣柴扉久不开。\n春色满园关不住，一枝红杏出墙来。"],["枫桥夜泊","唐·张继","月落乌啼霜满天，江枫渔火对愁眠。\n姑苏城外寒山寺，夜半钟声到客船。"],["逢雪宿芙蓉山主人","唐·刘长卿","日暮苍山远，天寒白屋贫。\n柴门闻犬吠，风雪夜归人。"],["春日","宋·朱熹","胜日寻芳泗水滨，无边光景一时新。\n等闲识得东风面，万紫千红总是春。"],["游子吟","唐·孟郊","慈母手中线，游子身上衣。\n临行密密缝，意恐迟迟归。\n谁言寸草心，报得三春晖。"],["春夜喜雨","唐·杜甫","好雨知时节，当春乃发生。\n随风潜入夜，润物细无声。\n野径云俱黑，江船火独明。\n晓看红湿处，花重锦官城。"],["秋夜将晓出篱门迎凉有感二首·其二","宋·陆游","三万里河东入海，五千仞岳上摩天。\n遗民泪尽胡尘里，南望王师又一年。"],["从军行七首·其四","唐·王昌龄","青海长云暗雪山，孤城遥望玉门关。\n黄沙百战穿金甲，不破楼兰终不还。"]];
const $=id=>document.getElementById(id);const synth=window.speechSynthesis;let index=0,line=0,playing=false,token=0,currentUtterance=null,voices=[];
// Each browser keeps its own learned marks; poem data and existing playback state are unchanged.
const learnedKey='shinan-poetry-level3-50-learned-v1';let learned={};
try{const saved=JSON.parse(localStorage.getItem(learnedKey)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))learned=saved}catch{}
const poemId=p=>p[0]+'｜'+p[1];
const isLearned=i=>Boolean(learned[poemId(poems[i])]);
const availableCount=()=>poems.reduce((n,_,i)=>n+(isLearned(i)?0:1),0);
function saveLearned(){try{localStorage.setItem(learnedKey,JSON.stringify(learned))}catch{}}
function nextAvailable(from,step){for(let offset=1;offset<=poems.length;offset++){const i=(from+step*offset+poems.length*2)%poems.length;if(!isLearned(i))return i}return null}
function noUnlearned(){stop();status('这一批都已标为学会，可在下方“已学会”列表恢复。')}
function renderLearned(){const marked=isLearned(index);$('learned').textContent=marked?'↺ 恢复到播放列表':'✓ 标为已学会';$('learned').setAttribute('aria-pressed',String(marked));$('catalog-summary').textContent=`播放列表 · ${availableCount()} 首`;
 const box=$('learned-list');box.replaceChildren();const entries=poems.map((poem,i)=>({poem,i})).filter(({i})=>isLearned(i));$('learned-summary').textContent=`已学会 · ${entries.length} 首`;
 if(!entries.length){const p=document.createElement('p');p.className='empty';p.textContent='标记已学会的诗词会在这里，可以随时恢复。';box.append(p)}
 for(const {poem,i} of entries){const row=document.createElement('div');row.className='learned-row';const label=document.createElement('span');label.textContent=`《${poem[0]}》 · ${poem[1]}`;const button=document.createElement('button');button.type='button';button.className='restore';button.textContent='恢复';button.setAttribute('aria-label',`恢复《${poem[0]}》到播放列表`);button.onclick=()=>{delete learned[poemId(poem)];saveLearned();render()};row.append(label,button);box.append(row)}}
try{index=Math.max(0,Math.min(poems.length-1,Number(localStorage.getItem('shinan-poetry-level3-50-index'))||0));$('rate').value='0.8'}catch{}
function status(s){$('status').textContent=s}function stop(){playing=false;token++;if(synth)synth.cancel();currentUtterance=null;$('play').textContent='▶ 播放朗读'}
function list(){const q=$('search').value.trim();$('list').replaceChildren();poems.forEach((p,i)=>{if(isLearned(i)||q&&!`${p[0]}${p[1]}`.includes(q))return;const b=document.createElement('button');b.className='pick'+(i===index?' current':'');b.setAttribute('aria-current',i===index?'true':'false');const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');const t=document.createElement('span');t.textContent=p[0];b.append(n,t);b.onclick=()=>choose(i);$('list').append(b)});if(!$('list').children.length){const p=document.createElement('p');p.className='empty';p.textContent=availableCount()?'没有找到这首诗':'播放列表已清空，请在下方恢复已学会的诗词';$('list').append(p)}}
function render(){const p=poems[index];$('title').textContent=p[0];$('author').textContent=p[1];$('counter').textContent=`${String(index+1).padStart(2,'0')} / ${poems.length} 首`;$('verses').replaceChildren();p[2].split('\n').forEach((text,i)=>{const e=document.createElement('p');e.className='verse';e.dataset.line=i+2;e.textContent=text;$('verses').append(e)});list();renderLearned();try{localStorage.setItem('shinan-poetry-level3-50-index',index)}catch{}highlight()}
function highlight(){document.querySelectorAll('.verse').forEach(e=>e.classList.toggle('active',playing&&Number(e.dataset.line)===line))}
function choose(i,step=1){if(!availableCount()){noUnlearned();return}const resume=playing;stop();const target=(i+poems.length)%poems.length;index=isLearned(target)?nextAvailable((target-step+poems.length)%poems.length,step):target;line=0;render();status('已切换至《'+poems[index][0]+'》');if(resume)start()}
// Homophone aliases affect speech only; displayed titles and verses stay unchanged.
const pronunciationAliases=[["其一","其衣"],["京口瓜洲一水间","京口刮洲义水见"],["一水","义水"],["一毛","义毛"],["一片","宜片"],["一程","义程"],["一更","义耕"],["一格","义格"],["一声","义声"],["一树","宜树"],["一杯","义杯"],["一年","义年"],["一鉴","宜鉴"],["一叶","宜叶"],["一枝","义枝"],["一时","义时"],["初闻涕泪满衣裳","初闻涕泪满衣常"],["西塞山前","西赛山前"],["四时田园杂兴","四时田园杂幸"],["雨雪霏霏","玉雪霏霏"],["单于夜遁逃","蝉于夜遁逃"],["只等闲","止等闲"],["明月何时照我还","明月何时照我环"],["不破楼兰终不还","不破楼兰终不环"],["旧时茅店社林边，路转溪桥忽见","旧时茅店社林边，路转溪桥忽现"],["书湖阴先生壁","书湖阴先声壁"],["大漠沙如雪","大漠砂如雪"],["脉脉不得语","脉脉不德语"],["渭城朝雨","渭城昭雨"],["瓜洲","刮洲"],["才了蚕桑","才蓼蚕桑"],["村庄儿女各当家","村庄儿女各当嘉"],["少小离家老大回","绍小离家老大回"],["刘长卿","刘常卿"]];
const spokenTitles={
  '长相思·山一程':'常相思',
  '己亥杂诗·九州生气恃风雷':'己亥杂诗',
  '凉州词·黄河远上白云间':'凉州词',
  '渔歌子·西塞山前白鹭飞':'渔歌子',
  '绝句·江碧鸟逾白':'绝句'
};
function speechText(text){
  text=spokenTitles[text]||text;
  text=text.replace(/^(.+?)[一二三四五六七八九十百]+首·(其[一二三四五六七八九十百]+)$/,'$1$2');
  for(const [original,alias] of pronunciationAliases)text=text.replaceAll(original,alias);
  return text
}
function groupInfo(title){return title.match(/^(前出塞九首|后出塞五首|秦州杂诗二十首)·其(.+)$/)}
function start(){if(!synth)return;if(!availableCount()){noUnlearned();return}if(isLearned(index)){stop();index=nextAvailable(index,1);line=0;render()}stop();playing=true;const my=token;$('play').textContent='Ⅱ 暂停朗读';function speak(){if(!playing||my!==token)return;const p=poems[index],segments=[p[0],p[1].replace('·','，'),...p[2].split('\n')];const group=groupInfo(p[0]);if(group){if(group[2]==='一')segments[0]=group[1];else if(line<2)line=2}if(line>=segments.length){line=0;highlight();if($('loop').checked||$('auto').checked){status($('loop').checked?'本首朗读完成 · 1秒后再次朗读':'本首朗读完成 · 1秒后播放下一首');setTimeout(()=>{if(my!==token||!playing)return;if(!$('auto').checked&&!$('loop').checked){stop();highlight();status('本首朗读完成');return}if(!$('loop').checked)index=nextAvailable(index,1);render();start()},1000)}else{playing=false;$('play').textContent='↻ 再听一遍';highlight();status($('auto').checked?'50首已全部朗读完成':'本首朗读完成')}return}highlight();status(line<2?'正在朗读诗名与作者':'正在朗读 · 第'+(line-1)+'句');const u=new SpeechSynthesisUtterance(speechText(segments[line]));currentUtterance=u;u.lang='zh-CN';u.rate=Number($('rate').value);const selected=voices.find(v=>v.voiceURI===$('voice').value);if(selected)u.voice=selected;u.onend=()=>{if(my!==token||!playing)return;line++;speak()};u.onerror=e=>{if(my!==token||e.error==='canceled'||e.error==='interrupted')return;stop();highlight();status('朗读未能启动，请重新点击播放，或换一个中文声音。')};synth.speak(u)}speak()}
$('play').onclick=()=>{if(playing){stop();highlight();status('已暂停 · 再次播放从当前句继续')}else start()};$('prev').onclick=()=>choose(index-1,-1);$('next').onclick=()=>choose(index+1,1);$('restart').onclick=()=>{line=0;start()};$('hide').onclick=()=>{const hide=$('reading').classList.toggle('hidden');$('hide').textContent=hide?'显示正文':'隐藏正文';$('hide').setAttribute('aria-pressed',String(hide))};$('rate').onchange=()=>{try{localStorage.setItem('shinan-poetry-level3-50-rate',$('rate').value)}catch{}if(playing)start()};$('voice').onchange=()=>{if(playing)start()};$('search').oninput=list;$('learned').onclick=()=>{const id=poemId(poems[index]);if(learned[id])delete learned[id];else learned[id]=true;saveLearned();if(isLearned(index)&&playing){if(!availableCount()){noUnlearned();render()}else choose(index+1,1)}else render()};
$('auto').onchange=()=>{if($('auto').checked)$('loop').checked=false};$('loop').onchange=()=>{if($('loop').checked)$('auto').checked=false};
function loadVoices(){if(!synth)return;const old=$('voice').value;voices=synth.getVoices().filter(v=>/^zh|cmn|yue/i.test(v.lang));document.querySelector('.voicewrap').hidden=voices.length<=1;$('voice').replaceChildren();const a=document.createElement('option');a.value='';a.textContent='设备默认中文';$('voice').append(a);voices.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name;$('voice').append(o)});if(voices.some(v=>v.voiceURI===old))$('voice').value=old;else{const mainland=voices.find(v=>/^zh[-_]CN$|^cmn[-_]CN/i.test(v.lang));if(mainland)$('voice').value=mainland.voiceURI}}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices()}else{$('play').disabled=true;$('restart').disabled=true;status('当前浏览器不支持语音朗读，请用 Safari 或 Chrome 打开。')}window.addEventListener('pagehide',()=>{stop()});if(isLearned(index)&&availableCount())index=nextAvailable(index,1);render();
</script></body></html>
